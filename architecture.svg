<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Physical wiring architecture</text>

  <!-- ================================================================ -->
  <!-- LEFT: Field devices                                              -->
  <!-- ================================================================ -->
  <text x="120" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#73726C">Field devices</text>

  <!-- Sensors group -->
  <rect x="30" y="78" width="180" height="150" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="98" text-anchor="middle" font-size="13" font-weight="500" fill="#0F6E56">Sensors</text>

  <rect x="46" y="110" width="148" height="24" rx="4" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="126" text-anchor="middle" font-size="11" fill="#2C2C2A">Bilge float switch</text>

  <rect x="46" y="140" width="148" height="24" rx="4" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="156" text-anchor="middle" font-size="11" fill="#2C2C2A">Temperature probe</text>

  <rect x="46" y="170" width="148" height="24" rx="4" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="186" text-anchor="middle" font-size="11" fill="#2C2C2A">Current transformer</text>

  <rect x="46" y="200" width="148" height="24" rx="4" fill="#fff" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="#2C2C2A">Tank sender</text>

  <!-- Actuators group -->
  <rect x="30" y="242" width="180" height="120" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="120" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#854F0B">Actuators</text>

  <rect x="46" y="274" width="148" height="24" rx="4" fill="#fff" stroke="#854F0B" stroke-width="0.5"/>
  <text x="120" y="290" text-anchor="middle" font-size="11" fill="#2C2C2A">Relay outputs</text>

  <rect x="46" y="304" width="148" height="24" rx="4" fill="#fff" stroke="#854F0B" stroke-width="0.5"/>
  <text x="120" y="320" text-anchor="middle" font-size="11" fill="#2C2C2A">Solenoids / pumps</text>

  <rect x="46" y="334" width="148" height="24" rx="4" fill="#fff" stroke="#854F0B" stroke-width="0.5"/>
  <text x="120" y="350" text-anchor="middle" font-size="11" fill="#2C2C2A">Navigation lights</text>

  <!-- Circuit label -->
  <text x="120" y="388" text-anchor="middle" font-size="11" fill="#73726C" font-style="italic">Each circuit = one YAML sheet</text>

  <!-- ================================================================ -->
  <!-- CENTER: DIN rail panel                                           -->
  <!-- ================================================================ -->
  <text x="460" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#73726C">DIN rail panel</text>

  <!-- Panel outline -->
  <rect x="310" y="78" width="300" height="320" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="460" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#5F5E5A">Electrical enclosure</text>

  <!-- DIN rail bar -->
  <rect x="330" y="112" width="260" height="8" rx="2" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>

  <!-- Modbus I/O modules on DIN rail -->
  <rect x="340" y="128" width="72" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="376" y="148" text-anchor="middle" font-size="11" font-weight="500" fill="#185FA5">Relay</text>
  <text x="376" y="162" text-anchor="middle" font-size="10" fill="#73726C">module</text>
  <text x="376" y="186" text-anchor="middle" font-size="10" fill="#73726C">8 ch DO</text>

  <rect x="420" y="128" width="72" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="456" y="148" text-anchor="middle" font-size="11" font-weight="500" fill="#185FA5">Digital</text>
  <text x="456" y="162" text-anchor="middle" font-size="10" fill="#73726C">input</text>
  <text x="456" y="186" text-anchor="middle" font-size="10" fill="#73726C">8 ch DI</text>

  <rect x="500" y="128" width="72" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="536" y="148" text-anchor="middle" font-size="11" font-weight="500" fill="#185FA5">Analog</text>
  <text x="536" y="162" text-anchor="middle" font-size="10" fill="#73726C">input</text>
  <text x="536" y="186" text-anchor="middle" font-size="10" fill="#73726C">4 ch AI</text>

  <!-- Modbus RS-485 bus line connecting modules -->
  <line x1="376" y1="200" x2="376" y2="218" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="456" y1="200" x2="456" y2="218" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="536" y1="200" x2="536" y2="218" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="376" y1="218" x2="536" y2="218" stroke="#185FA5" stroke-width="1.5"/>
  <text x="460" y="234" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Modbus RS-485 bus</text>

  <!-- Terminal blocks -->
  <rect x="340" y="250" width="110" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="395" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56">Terminal blocks</text>
  <text x="395" y="284" text-anchor="middle" font-size="10" fill="#73726C">PTFIX ground blocks</text>

  <!-- Power distribution -->
  <rect x="460" y="250" width="130" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="525" y="270" text-anchor="middle" font-size="11" font-weight="500" fill="#854F0B">Power distribution</text>
  <text x="525" y="284" text-anchor="middle" font-size="10" fill="#73726C">Fuses + breakers</text>

  <!-- Wiring sheet label inside panel -->
  <rect x="340" y="310" width="250" height="34" rx="6" fill="#fff" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="465" y="332" text-anchor="middle" font-size="11" fill="#5F5E5A">Wire labels match YAML sheet IDs (W01-05)</text>

  <!-- Power in arrow -->
  <text x="460" y="380" text-anchor="middle" font-size="10" fill="#854F0B">12/24 V DC from batteries</text>
  <line x1="460" y1="384" x2="460" y2="398" stroke="#854F0B" stroke-width="1" marker-start="url(#a)"/>

  <!-- ================================================================ -->
  <!-- RIGHT: Automation engine                                         -->
  <!-- ================================================================ -->
  <text x="730" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#73726C">Automation engine</text>

  <rect x="660" y="78" width="160" height="130" rx="10" fill="#0B2545" stroke="#0B2545" stroke-width="0.5"/>
  <text x="740" y="102" text-anchor="middle" font-size="13" font-weight="500" fill="#E8E8E8">Raspberry Pi</text>
  <rect x="676" y="114" width="128" height="24" rx="4" fill="#1B4F72"/>
  <text x="740" y="130" text-anchor="middle" font-size="11" fill="#E8E8E8">SignalK hub</text>
  <rect x="676" y="144" width="128" height="24" rx="4" fill="#1B4F72"/>
  <text x="740" y="160" text-anchor="middle" font-size="11" fill="#E8E8E8">Rules engine</text>
  <rect x="676" y="174" width="128" height="24" rx="4" fill="#1B4F72"/>
  <text x="740" y="190" text-anchor="middle" font-size="11" fill="#E8E8E8">Grafana dashboards</text>

  <!-- Vessel-ops connection -->
  <rect x="660" y="230" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="740" y="250" text-anchor="middle" font-size="11" font-weight="500" fill="#185FA5">vessel-ops</text>
  <text x="740" y="264" text-anchor="middle" font-size="10" fill="#73726C">LAN / API</text>

  <!-- Arrow: Pi to vessel-ops -->
  <line x1="740" y1="208" x2="740" y2="228" stroke="#185FA5" stroke-width="1" marker-end="url(#a)"/>

  <!-- Alarm panel connection -->
  <rect x="660" y="290" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="740" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#993C1D">alarm-panel</text>
  <text x="740" y="324" text-anchor="middle" font-size="10" fill="#73726C">GPIO / Modbus</text>

  <!-- Arrow: Pi to alarm-panel -->
  <line x1="740" y1="274" x2="740" y2="288" stroke="#993C1D" stroke-width="1" marker-end="url(#a)"/>

  <!-- ================================================================ -->
  <!-- ARROWS: Field → Panel → Engine                                   -->
  <!-- ================================================================ -->

  <!-- Sensors → DI/AI modules -->
  <line x1="210" y1="153" x2="308" y2="153" stroke="#0F6E56" stroke-width="1" marker-end="url(#a)"/>
  <text x="259" y="146" text-anchor="middle" font-size="9" fill="#0F6E56">signal wires</text>

  <!-- Actuators → Relay module -->
  <line x1="210" y1="302" x2="308" y2="180" stroke="#854F0B" stroke-width="1" marker-start="url(#a)"/>
  <text x="248" y="248" text-anchor="middle" font-size="9" fill="#854F0B">switched loads</text>

  <!-- Modbus bus → Pi (RS-485) -->
  <line x1="538" y1="218" x2="658" y2="143" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="610" y="170" text-anchor="middle" font-size="9" font-weight="500" fill="#185FA5">RS-485</text>

  <!-- ================================================================ -->
  <!-- BOTTOM: Commissioning workflow                                    -->
  <!-- ================================================================ -->
  <rect x="30" y="425" width="790" height="55" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="425" y="446" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">Commissioning workflow (per circuit)</text>

  <!-- Steps -->
  <rect x="60" y="455" width="80" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="100" y="469" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Wire</text>

  <line x1="142" y1="465" x2="158" y2="465" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>

  <rect x="160" y="455" width="80" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="200" y="469" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Ring out</text>

  <line x1="242" y1="465" x2="258" y2="465" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>

  <rect x="260" y="455" width="80" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="300" y="469" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Prove</text>

  <line x1="342" y1="465" x2="358" y2="465" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>

  <rect x="360" y="455" width="80" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="400" y="469" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Record</text>

  <line x1="442" y1="465" x2="458" y2="465" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>

  <rect x="460" y="455" width="80" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="500" y="469" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Accept</text>

  <line x1="542" y1="465" x2="558" y2="465" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>

  <rect x="560" y="455" width="80" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="600" y="469" text-anchor="middle" font-size="10" font-weight="500" fill="#0F6E56">Live</text>

  <!-- Legend -->
  <text x="425" y="520" text-anchor="middle" font-size="10" fill="#73726C">Each YAML wiring sheet defines one circuit: rungs, wires, cable runs, checks, and tests.</text>
  <text x="425" y="535" text-anchor="middle" font-size="10" fill="#73726C">build.py validates all sheets against the device register and renders browsable HTML.</text>
  <text x="425" y="550" text-anchor="middle" font-size="10" fill="#73726C">Wire labels (W01-05) match from YAML to heat-shrink sleeve to terminal block.</text>
</svg>
